<footer class="footer">
  <div class="brand-bar"></div>
  <div class="container footer-inner">
    <div class="footer-brand">
      <app-logo size="sm" />
      <p class="muted">{{ t().footer.tagline }}</p>
      <p class="footer-contact">
        <span class="muted">{{ t().nav.contact }}:</span>
        <span class="email">{{ site.contactEmail }}</span>
      </p>
    </div>
    <nav class="footer-nav" [attr.aria-label]="t().footer.navAria">
      <a routerLink="/games">{{ t().nav.games }}</a>
      <a routerLink="/books">{{ t().nav.books }}</a>
      <a routerLink="/privacy">{{ t().nav.privacy }}</a>
    </nav>
  </div>
  <div class="container footer-bottom">
    <small>© {{ year }} {{ site.name }} · {{ t().footer.rights }}</small>
  </div>
</footer>
